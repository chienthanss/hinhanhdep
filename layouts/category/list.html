{{ define "main" }}
<div class="container-xxl py-4">
  <header class="mb-5 text-center">
    <h1>All Categories</h1>
    <p class="lead text-muted">Explore wallpapers by your favorite topics</p>
  </header>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    {{ range .Pages }}
      <div class="col">
        <a href="{{ .RelPermalink }}" class="text-decoration-none">
          <div class="card h-100 shadow-sm text-center border-0 bg-light hover-shadow">
            <div class="card-body py-5">
              <h2 class="h4 card-title text-dark mb-2">{{ .Title }}</h2>
              <p class="text-muted mb-0">{{ len .Pages }} wallpapers</p>
            </div>
          </div>
        </a>
      </div>
    {{ end }}
  </div>
</div>
{{ end }}
