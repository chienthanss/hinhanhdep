{{/* Get the first 5 images from the JSON data */}}
{{ $wallpapers := first 5 site.Data.wallpapers }}

<div id="heroCarousel" class="carousel slide mb-5 shadow-sm rounded overflow-hidden" data-bs-ride="carousel">
  <div class="carousel-indicators">
    {{ range $index, $item := $wallpapers }}
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="{{ $index }}" class="{{ if eq $index 0 }}active{{ end }}"></button>
    {{ end }}
  </div>
  <div class="carousel-inner">
    {{ range $index, $item := $wallpapers }}
      <div class="carousel-item {{ if eq $index 0 }}active{{ end }}">
        <a href="/wallpaper/{{ $item.slug }}/">
          <img src="{{ $item.remote_thumb }}" class="d-block w-100" alt="{{ $item.title }}" style="height: 500px; object-fit: cover;">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3">
            <h5 class="fw-bold">{{ $item.title }}</h5>
          </div>
        </a>
      </div>
    {{ end }}
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>
