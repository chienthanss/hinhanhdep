title = "Wallpaper Gallery"
copyright = "Copyright © 2026 Wallpaper Gallery."
enableGitInfo = false

# ==========================================
# ✅ SỬA: baseURL thật của site
# ==========================================
baseURL = "https://hinhanhdep.org/"
canonifyURLs = false
enableRobotsTXT = true
summaryLength = 30

# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

# Tăng timeout vì Content Adapter với hàng triệu page có thể build lâu
timeout = "600s"

languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Chỉ giữ XML (cần cho sitemap). Bỏ server/netlify/REDIR vì không dùng Netlify.
[outputFormats]
  [outputFormats.XML]
    isPlainText = false
    mediaType = "application/xml"
    isHtml = false
    noUgly = true
    permalinkable = false
    name = "xml"

# Sitemap được bật cho mọi loại trang để Google Search Console nhận đủ
[outputs]
  home     = ["HTML", "RSS", "sitemap"]
  section  = ["HTML", "sitemap"]
  taxonomy = ["HTML", "sitemap"]
  term     = ["HTML", "sitemap"]

[build]
  writeStats = true

# Thêm category bên cạnh tag
[taxonomies]
  tag      = "tags"
  category = "categories"

# Permalinks khớp quy ước URL của dự án
[permalinks]
  wallpaper  = "/wallpaper/:slug/"
  tags       = "/tag/:slug/"
  categories = "/category/:slug/"

# 48 ảnh/trang (grid Hinode v3 hiển thị đẹp ở mức này)
[pagination]
  pagerSize = 48

[services]
  [services.googleAnalytics]
    # ID = "G-xxxxxxxxxx"

[minify]
  [minify.tdewolff.js]
    precision = 0
    version = 2022
  [minify.tdewolff.html]
    keepWhitespace = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.136.3"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.imports]]
    path = "github.com/gethinode/mod-blocks/v2"
  [[module.imports]]
    path = "github.com/gethinode/hinode/v3"

# ==========================================
# KHAI BÁO DOMAIN ẢNH CHO THEME HINODE
# ✅ SỬA: thêm tất cả domain images*.alphacoders.com
# ==========================================
[params]
  [params.modules]
    [params.modules.hinode]
      [params.modules.hinode.csp]
        img-src = [
          "https://hinhanhdep.org",
          "https://img.hinhanhdep.org",
          "https://images.alphacoders.com",
          "https://images2.alphacoders.com",
          "https://images3.alphacoders.com",
          "https://images4.alphacoders.com",
          "https://images5.alphacoders.com",
          "https://images6.alphacoders.com",
          "https://images7.alphacoders.com"
        ]