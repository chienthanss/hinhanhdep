{{/* Get the first 8 images from the JSON data */}}
{{ $wallpapers := first 8 site.Data.wallpapers }}

<div class="container-fluid px-0 my-5">
  <div class="d-flex justify-content-between align-items-end mb-4">
    <h2 class="h4 fw-bold mb-0">Featured Wallpapers</h2>
    <a href="/wallpaper/" class="text-decoration-none fw-bold">View All &rarr;</a>
  </div>
  
  <div class="row row-cols-2 row-cols-md-4 g-3">
    {{ range $wallpapers }}
      <div class="col">
        <div class="card h-100 border-0 shadow-sm hover-shadow transition">
          <a href="/wallpaper/{{ .slug }}/">
            <img src="{{ .remote_thumb }}" alt="{{ .title }}" class="card-img-top" loading="lazy" style="aspect-ratio: 16/9; object-fit: cover;">
          </a>
          <div class="card-body p-3">
            <h3 class="h6 card-title text-truncate mb-0">
              <a href="/wallpaper/{{ .slug }}/" class="text-decoration-none text-reset stretched-link">{{ .title }}</a>
            </h3>
          </div>
        </div>
      </div>
    {{ end }}
  </div>
</div>
